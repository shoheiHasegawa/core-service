[project]
name = "core-service"
version = "0.1.0"
description = "Core service domain logic and API"
authors = [{ name = "You_Inc", email = "info@example.com" }]
requires-python = ">=3.11"

dependencies = [
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "holidays>=0.100",
    "python-dotenv>=1.2.2",
    "sqlalchemy",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
filterwarnings = ["error"]
xfail_strict = true

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]
