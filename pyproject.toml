[project]
name = "core-service"
version = "0.1.0"
description = "Core service domain logic and API"
authors = [{ name = "You_Inc", email = "info@example.com" }]
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]
